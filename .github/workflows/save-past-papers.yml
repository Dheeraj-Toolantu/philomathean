# Searches PapaCambridge for a subject, downloads the matching PDFs (closing any ads that appear) and
# commits them, unchanged, under past-papers/igcse/<subject>/ on the branch the workflow was started on.
# Start it from Actions → "Save past papers to repo" → Run workflow.
name: Save past papers to repo

on:
  workflow_dispatch:
    inputs:
      search_term:
        description: Subject to search for on the IGCSE listing
        default: Mathematics 0444
        required: true
      file_filter:
        description: '"solved" for mark schemes / solved papers, a regex, or empty for every PDF'
        default: solved
        required: false
      max_files:
        description: Stop after this many new PDFs (0 = no limit)
        default: '0'
        required: true

concurrency:
  group: save-past-papers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: automation/past-papers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/past-papers/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download PDFs
        env:
          SEARCH_TERM: ${{ inputs.search_term }}
          FILE_FILTER: ${{ inputs.file_filter }}
          MAX_FILES: ${{ inputs.max_files }}
        run: npm run download
      - name: Commit new PDFs
        working-directory: .
        env:
          SEARCH_TERM: ${{ inputs.search_term }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add past-papers
          if git diff --cached --quiet; then
            echo "No new past papers to commit."
            exit 0
          fi
          git commit -m "Add IGCSE ${SEARCH_TERM} past papers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
