# Reads automation/past-papers/search-terms.txt (one subject per line), searches PapaCambridge for
# each, opens every folder and subfolder of the results, downloads the PDFs (closing any ads that
# appear), swaps the PapaCambridge watermark for the Philomathean logo watermark, names each PDF
# after its year and content (rebrand-pdf.js) and commits them under past-papers/igcse/<search-text>/ on the branch the
# workflow was started on. To change what is downloaded, edit search-terms.txt and run this again.
# Start it from Actions → "Save past papers to repo" → Run workflow.
name: Save past papers to repo

on:
  workflow_dispatch:
    inputs:
      search_term:
        description: Search just this subject instead of the list in search-terms.txt (leave empty to use the file)
        default: ''
        required: false
      file_filter:
        description: Leave empty for every PDF, "solved" for mark schemes only, or a regex
        default: ''
        required: false
      max_files:
        description: Stop after this many new PDFs per search term (0 = no limit)
        default: '0'
        required: true

concurrency:
  group: save-past-papers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: automation/past-papers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/past-papers/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download PDFs
        env:
          SEARCH_TERM: ${{ inputs.search_term }}
          FILE_FILTER: ${{ inputs.file_filter }}
          MAX_FILES: ${{ inputs.max_files }}
        run: npm run download
      - name: Commit new PDFs
        working-directory: .
        env:
          SEARCH_TERM: ${{ inputs.search_term }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add past-papers
          if git diff --cached --quiet; then
            echo "No new past papers to commit."
            exit 0
          fi
          git commit -m "Add IGCSE past papers${SEARCH_TERM:+ for ${SEARCH_TERM}}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
