# Builds and tests every pull request; deploys the website and Firestore indexes to Firebase
# whenever main changes. Requires the FIREBASE_SERVICE_ACCOUNT repository secret (a service-account
# JSON key with the Firebase Hosting Admin, Cloud Datastore Index Admin and Service Usage Consumer roles).
name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy hosting and Firestore indexes
        run: npx --yes firebase-tools@14 deploy --only hosting,firestore:indexes --project philomathean-a2c93 --non-interactive
