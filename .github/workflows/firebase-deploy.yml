# Builds and tests every pull request; deploys the website, Firestore indexes and the Firestore/Storage
# security rules to Firebase whenever main changes. Requires the FIREBASE_SERVICE_ACCOUNT repository secret
# (a service-account JSON key with the Firebase Hosting Admin, Cloud Datastore Index Admin, Service Usage
# Consumer and Firebase Rules Admin roles).
name: Build and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy hosting and Firestore indexes
        run: npx --yes firebase-tools@14 deploy --only hosting,firestore:indexes --project philomathean-a2c93 --non-interactive
      # The student portal (sign-up, login, dashboard) only works once these rules are live.
      # Kept as its own step so a missing permission never blocks the website deploy above.
      - name: Deploy Firestore and Storage security rules
        run: |
          if ! npx --yes firebase-tools@14 deploy --only firestore:rules,storage --project philomathean-a2c93 --non-interactive; then
            echo "::error title=Security rules were not deployed::Give the FIREBASE_SERVICE_ACCOUNT service account the 'Firebase Rules Admin' role in Google Cloud IAM (or 'Firebase Admin'), then re-run this workflow. Until the rules are deployed, student sign-up and login fail."
            exit 1
          fi
